front-end.web.baseUrl=${FE_WEB_BASE_URL}

spring.datasource.url=${DB_URL}

firebase.credentials-path=${FIREBASE_SA_KEY_PATH}
#====================================
#enable flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


#====================================
#supabase
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SP_JWT_ISSUER_URI}

supabase.url=${SP_URL}
supabase.api-secret-key=${SP_API_SECRET_KEY}
supabase.bucket=${SP_BUCKET_NAME}

#====================================
#springdoc
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

#====================================
#gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

#====================================
spring.rabbitmq.addresses=${RBMQ_AMQP_URL}

#====================================
#redis
spring.data.redis.host=${RD_HOST}
spring.data.redis.port=${RD_PORT}
spring.data.redis.password=${RD_PASSWORD}

#====================================
face-authen.api.base-url=${FACEAUTHEN_API_BASE_URL}
