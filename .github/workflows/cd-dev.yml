name: Deploy-dev

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # login docker hub
      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set version
        run: echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hvh:${{ env.VERSION }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/hvh:${{ env.VERSION }} ${{ secrets.DOCKER_USERNAME }}/hvh:latest

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/hvh:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/hvh:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # run after job build-and-push success
    steps:
      # deploy to VM via SSH
      - name: Deploy to VM
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd /home/dieutthhe180081/deploy
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f